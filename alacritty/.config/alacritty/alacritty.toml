[font]
size = 16.0

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Regular"

[scrolling]
history = 10000
multiplier = 3

[window]
decorations = "Full"
dynamic_title = true
opacity = 0.90
startup_mode = "Windowed"

[window.padding]
x = 20
y = 20

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true
