name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck

      - name: ShellCheck setup.sh
        run: shellcheck --severity=error setup.sh

      - name: Bash syntax check
        run: bash -n setup.sh

      - name: Zsh syntax check
        run: |
          zsh -n zsh/.zshrc
          zsh -n zsh/aliases.zsh

      - name: Aliases smoke test
        run: |
          zsh -c 'source zsh/aliases.zsh && alias ls && type ff && alias glog'

  setup-script:
    name: Run setup.sh in container
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install git and prerequisites
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates

      - name: Move repo to expected dotfiles path
        run: |
          mkdir -p "$HOME/.dotfiles"
          cp -r "$GITHUB_WORKSPACE/." "$HOME/.dotfiles/"
          rm -rf "$HOME/.dotfiles/.git"

      - name: Run setup.sh
        env:
          HOME: /root
        run: |
          cd "$HOME/.dotfiles"
          bash setup.sh
