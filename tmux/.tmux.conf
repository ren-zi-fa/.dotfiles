# Status bar
set -g status-bg black
set -g status-fg white

# Terminal compatibility.
# Alacritty sends TERM=alacritty over SSH. The server needs the `ncurses-term`
# package so this terminfo entry exists; otherwise tmux fails with:
#   missing or unsuitable terminal: alacritty
set -g default-terminal "tmux-256color"
set -as terminal-features ',alacritty*:clipboard'
set -as terminal-features ',*:RGB'

# Keep Esc snappy in Vim (default is 500ms).
set -sg escape-time 10

bind -n M-1 select-window -t 0
bind -n M-2 select-window -t 1
bind -n M-3 select-window -t 2
bind -n M-4 select-window -t 3
bind -n M-5 select-window -t 4
bind -n M-6 select-window -t 5
bind -n M-7 select-window -t 6
bind -n M-8 select-window -t 7
bind -n M-9 select-window -t 8

# Enable mouse mode
set -g mouse on

# Clipboard: let tmux forward copies to the local terminal via OSC 52.
# Do NOT pipe through xclip/wl-copy — this VPS is headless (no X/Wayland).
# Use the terminal's own paste shortcut (Ctrl+Shift+V in Alacritty).
set -g set-clipboard on
